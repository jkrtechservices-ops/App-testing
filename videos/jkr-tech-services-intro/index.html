<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
      body {
        font-family: "Inter", sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #0a0a0f;
      }

      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        box-sizing: border-box;
      }

      #title {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        font-size: 108px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #ffffff;
        text-align: center;
      }

      #title .accent {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="scene-content">
          <span><span class="accent">JKR</span> Tech Services</span>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // seek-safe reveal: hidden until the pop-in beat, paired with the motion-only from()
      gsap.set("#title", { autoAlpha: 0 });

      // pop-in: scale + fade, back-out for a confident "pop" feel
      tl.fromTo(
        "#title",
        { autoAlpha: 0, scale: 0.7 },
        { autoAlpha: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" },
        0.3
      );

      // hold, then smooth fade-out to close the card
      tl.to(
        "#title",
        { autoAlpha: 0, scale: 1.04, duration: 1.2, ease: "sine.inOut" },
        3.8
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
