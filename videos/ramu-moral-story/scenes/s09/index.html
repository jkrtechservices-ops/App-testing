<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      body { background: radial-gradient(ellipse 120% 90% at 50% 30%, #f6f0ff 0%, #ece0f7 55%, #dccbe9 100%); }
      #root { position: relative; width: 1920px; height: 1080px; }
      #three-layer { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.57" data-width="1920" data-height="1080" data-fps="30" data-no-timeline>
      <canvas id="three-layer"></canvas>
    </div>
    <script type="module">
      import * as THREE from "./three.module.min.js";
      import * as L from "./lib.js";
      try {
        const W = 1920, H = 1080;
        const canvas = document.getElementById("three-layer");
        const renderer = L.setupRenderer(canvas, W, H);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);

        L.setupLighting(scene, "soft");
        scene.add(L.makeGround({ color: L.COLORS.groundLush, size: 20 }));

        const elder = L.makePerson({ skin: L.COLORS.skinElder, shirt: L.COLORS.robeElder, pants: L.COLORS.robeElder, beard: true, build: "elder" });
        elder.position.set(0.9, 0, 0);
        elder.rotation.y = -0.55;
        scene.add(elder);

        const ramu = L.makePerson({ skin: L.COLORS.skinRamu, shirt: L.COLORS.shirtRamu, pants: L.COLORS.pantsRamu });
        ramu.position.set(-0.9, 0, 0.1);
        ramu.rotation.y = 0.55;
        scene.add(ramu);

        const diary = L.makeDiary([0, 0.95, 0.15]);
        scene.add(diary);

        function renderAt(time) {
          const t = time / 25.57;
          camera.position.set(-0.1 + Math.sin(t * 1.6) * 0.5, 1.5, 3.8 - t * 0.6);
          camera.lookAt(0, 1.25, 0.1);

          L.idleBreathe(ramu, time, { phase: 0 });
          L.idleBreathe(elder, time, { phase: 0.4, freq: 1.3 });

          // elder gestures, explaining — a slow sweeping arm
          elder.userData.armR.rotation.z = 0.4 + Math.sin(time * 0.9) * 0.5;
          elder.userData.armR.rotation.x = Math.sin(time * 0.6) * 0.25;

          diary.position.y = 0.95 + Math.sin(time * 0.7) * 0.02;
          diary.rotation.y = time * 0.3;

          renderer.render(scene, camera);
        }
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(window.__hfThreeTime || 0);
      } catch (err) {
        const d = document.createElement("div");
        d.style.cssText = "position:absolute;inset:0;background:#fff;color:#c00;font:22px monospace;padding:20px;white-space:pre-wrap;z-index:999;";
        d.textContent = "ERROR: " + err.message + "\n" + (err.stack || "");
        document.body.appendChild(d);
      }
    </script>
  </body>
</html>
