<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      body { background: radial-gradient(ellipse 120% 90% at 50% 30%, #fff3e6 0%, #f8e2cc 55%, #e9cdb0 100%); }
      #root { position: relative; width: 1920px; height: 1080px; }
      #three-layer { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.42" data-width="1920" data-height="1080" data-fps="30" data-no-timeline>
      <canvas id="three-layer"></canvas>
    </div>
    <script type="module">
      import * as THREE from "./three.module.min.js";
      import * as L from "./lib.js";
      try {
        const W = 1920, H = 1080;
        const canvas = document.getElementById("three-layer");
        const renderer = L.setupRenderer(canvas, W, H);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);

        L.setupLighting(scene, "warm");
        scene.add(L.makeGround({ color: 0xd8c49a, size: 20 }));

        // simple hut interior — back wall + floor patch
        const wall = new THREE.Mesh(new THREE.BoxGeometry(6, 2.6, 0.15), L.flat(0xe4d3ac));
        wall.position.set(0, 1.3, -1.4);
        scene.add(wall);

        const table = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 0.9), L.flat(L.COLORS.wood));
        table.position.set(0, 0.55, -0.3);
        const legMat = L.flat(L.COLORS.woodDark);
        for (const [x, z] of [[-0.65, -0.65], [0.65, -0.65], [-0.65, 0.05], [0.65, 0.05]]) {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 5), legMat);
          leg.position.set(x, 0.3, z + -0.3);
          scene.add(leg);
        }
        scene.add(table);

        const chest = L.makeChest([0, 0.55, -0.3]);
        scene.add(chest);

        // contents revealed on the table beside the chest
        const coin1 = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.015, 10), L.flat(0xb08a4a));
        coin1.rotation.x = Math.PI / 2;
        coin1.position.set(-0.35, 0.6, -0.15);
        const coin2 = coin1.clone(); coin2.position.set(-0.28, 0.6, -0.1);
        const papers = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 0.16), L.flat(L.COLORS.paperOld));
        papers.position.set(0.32, 0.59, -0.1);
        const diary = L.makeDiary([0.55, 0.6, -0.2]);
        [coin1, coin2, papers, diary].forEach((o) => { o.visible = false; scene.add(o); });

        const ramu = L.makePerson({ skin: L.COLORS.skinRamu, shirt: L.COLORS.shirtRamu, pants: L.COLORS.pantsRamu, scale: 0.95 });
        ramu.position.set(-1.1, 0, 0.5);
        ramu.rotation.y = 0.5;
        scene.add(ramu);

        const sita = L.makePerson({ skin: L.COLORS.skinSita, shirt: L.COLORS.sariSita, pants: L.COLORS.sariSita, scale: 0.92 });
        sita.position.set(1.1, 0, 0.5);
        sita.rotation.y = -0.5;
        scene.add(sita);

        const mohan = L.makePerson({ skin: L.COLORS.skinMohan, shirt: L.COLORS.shirtMohan, pants: L.COLORS.shortsMohan, build: "child", scale: 0.72 });
        mohan.position.set(0, 0, 1.15);
        scene.add(mohan);

        function renderAt(time) {
          camera.position.set(0, 1.5, 4.3);
          camera.lookAt(0, 1.05, -0.2);

          L.idleBreathe(ramu, time, { phase: 0 });
          L.idleBreathe(sita, time, { phase: 0.5 });
          L.idleBreathe(mohan, time, { phase: 1.0, freq: 2.0 });

          // lid opens across the first few seconds
          const openT = Math.min(1, Math.max(0, (time - 1.5) / 2.5));
          chest.userData.lidPivot.rotation.x = -openT * 1.9;

          // contents appear, then disappointment settles — heads/shoulders droop
          const revealed = time > 4.2;
          coin1.visible = coin2.visible = papers.visible = diary.visible = revealed;
          const slump = Math.min(1, Math.max(0, (time - 6) / 4)) * 0.22;
          [ramu, sita, mohan].forEach((p, i) => {
            p.rotation.x = slump;
            p.position.y = -slump * 0.05;
          });

          renderer.render(scene, camera);
        }
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(window.__hfThreeTime || 0);
      } catch (err) {
        const d = document.createElement("div");
        d.style.cssText = "position:absolute;inset:0;background:#fff;color:#c00;font:22px monospace;padding:20px;white-space:pre-wrap;z-index:999;";
        d.textContent = "ERROR: " + err.message + "\n" + (err.stack || "");
        document.body.appendChild(d);
      }
    </script>
  </body>
</html>
