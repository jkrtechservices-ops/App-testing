<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      body { background: radial-gradient(ellipse 120% 90% at 50% 30%, #fef6e4 0%, #f9e8c4 50%, #e9cf98 100%); }
      #root { position: relative; width: 1920px; height: 1080px; }
      #three-layer { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.54" data-width="1920" data-height="1080" data-fps="30" data-no-timeline>
      <canvas id="three-layer"></canvas>
    </div>
    <script type="module">
      import * as THREE from "./three.module.min.js";
      import * as L from "./lib.js";
      try {
        const W = 1920, H = 1080;
        const canvas = document.getElementById("three-layer");
        const renderer = L.setupRenderer(canvas, W, H);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);

        L.setupLighting(scene, "hopeful");
        scene.add(L.makeGround({ color: L.COLORS.groundDry }));
        scene.add(L.makeSun([5, 5, -6], 0xfff0b8));
        scene.add(L.makeWell([-2.6, 0, -1.2]));
        scene.add(L.makeCropRow({ position: [1.2, 0, 0.6], rows: 3, perRow: 6, spacing: 0.5, lush: false }));

        const ramu = L.makePerson({ skin: L.COLORS.skinRamu, shirt: L.COLORS.shirtRamu, pants: L.COLORS.pantsRamu });
        ramu.position.set(1.4, 0, 1.6);
        ramu.rotation.y = 0.5;
        scene.add(ramu);

        const sita = L.makePerson({ skin: L.COLORS.skinSita, shirt: L.COLORS.sariSita, pants: L.COLORS.sariSita });
        sita.position.set(-2.0, 0, 0.2);
        sita.rotation.y = -0.6;
        scene.add(sita);

        function renderAt(time) {
          const orbit = -0.5 + Math.sin(time * 0.14) * 0.35;
          camera.position.set(Math.sin(orbit) * 6.4, 2.0, Math.cos(orbit) * 6.4 - 0.5);
          camera.lookAt(-0.3, 1.0, 0.6);

          // Ramu bends rhythmically to work the soil
          const bend = Math.max(0, Math.sin(time * 1.7)) * 0.55;
          ramu.rotation.x = bend * 0.9;
          ramu.position.y = -bend * 0.12;
          L.armSwing(ramu.userData.armR, time, { base: -0.9, amp: 0.35, freq: 1.7 });
          L.armSwing(ramu.userData.armL, time, { base: -0.4, amp: 0.2, freq: 1.7, phase: 0.4 });

          // Sita drawing water at the well
          L.idleBreathe(sita, time, { phase: 0.8 });
          L.armSwing(sita.userData.armR, time, { base: -1.1, amp: 0.22, freq: 1.1 });

          renderer.render(scene, camera);
        }
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(window.__hfThreeTime || 0);
      } catch (err) {
        const d = document.createElement("div");
        d.style.cssText = "position:absolute;inset:0;background:#fff;color:#c00;font:22px monospace;padding:20px;white-space:pre-wrap;z-index:999;";
        d.textContent = "ERROR: " + err.message + "\n" + (err.stack || "");
        document.body.appendChild(d);
      }
    </script>
  </body>
</html>
