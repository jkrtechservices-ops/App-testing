<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      body { background: radial-gradient(ellipse 120% 90% at 50% 30%, #eaf8ee 0%, #dcf0e0 55%, #c8e6cf 100%); }
      #root { position: relative; width: 1920px; height: 1080px; }
      #three-layer { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.46" data-width="1920" data-height="1080" data-fps="30" data-no-timeline>
      <canvas id="three-layer"></canvas>
    </div>
    <script type="module">
      import * as THREE from "./three.module.min.js";
      import * as L from "./lib.js";
      try {
        const W = 1920, H = 1080;
        const canvas = document.getElementById("three-layer");
        const renderer = L.setupRenderer(canvas, W, H);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);

        L.setupLighting(scene, "hopeful");
        scene.add(L.makeGround({ color: L.COLORS.groundDry }));
        scene.add(L.makeSun([5, 5, -6], 0xfff2c0));

        const ramu = L.makePerson({ skin: L.COLORS.skinRamu, shirt: L.COLORS.shirtRamu, pants: L.COLORS.pantsRamu });
        ramu.position.set(0, 0, 1.6);
        scene.add(ramu);

        const diary = L.makeDiary([0, 0, 0]);
        diary.rotation.x = -0.3;
        ramu.userData.armL.userData.hand.add(diary);
        diary.position.set(0.02, -0.03, 0.06);

        const cropRow = L.makeCropRow({ position: [-0.6, 0, -0.6], rows: 4, perRow: 7, spacing: 0.55, lush: false });
        scene.add(cropRow);
        // pre-scale sprouts to zero — they grow in as Ramu plants
        cropRow.children.forEach((plant) => plant.scale.setScalar(0.001));

        function renderAt(time) {
          const t = time / 23.46;
          if (time < 8) {
            camera.position.set(1.1, 1.55, 2.6);
            camera.lookAt(0.15, 1.15, 1.5);
          } else {
            const pt = (time - 8) / 15.46;
            camera.position.set(-2.2 + pt * 3.2, 2.2 - pt * 0.3, 5.2 - pt * 1.4);
            camera.lookAt(-0.4, 0.8, -0.4);
          }

          L.idleBreathe(ramu, time, { phase: 0 });

          if (time < 8) {
            // reading the diary — gentle nod
            ramu.rotation.x = 0.18 + Math.sin(time * 1.2) * 0.03;
          } else {
            // determined planting — repeated bends across the row
            ramu.rotation.x = 0;
            const bend = Math.max(0, Math.sin((time - 8) * 2.0));
            ramu.rotation.x = bend * 0.5;
            // each plant has its own grow-in window, staggered by index — pure function of time
            const plantWindow = 0.7;
            const n = cropRow.children.length;
            cropRow.children.forEach((plant, i) => {
              const growStart = 8.4 + (i / n) * 13.5;
              const g = THREE.MathUtils.clamp((time - growStart) / plantWindow, 0, 1);
              plant.scale.setScalar(Math.max(0.001, g));
            });
          }

          renderer.render(scene, camera);
        }
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(window.__hfThreeTime || 0);
      } catch (err) {
        const d = document.createElement("div");
        d.style.cssText = "position:absolute;inset:0;background:#fff;color:#c00;font:22px monospace;padding:20px;white-space:pre-wrap;z-index:999;";
        d.textContent = "ERROR: " + err.message + "\n" + (err.stack || "");
        document.body.appendChild(d);
      }
    </script>
  </body>
</html>
